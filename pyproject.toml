[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "Hybrid (deterministic + LLM) pipeline for detecting security vulnerabilities in AI-generated code, mapped to OWASP Top 10:2025."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "semgrep==1.170.0",
    "anthropic==0.117.0",
    "python-dotenv==1.2.2",
    "streamlit==1.59.2",
    "pip-audit==2.10.1",
    "networkx==3.4.2",
    "pandas==2.3.3",
]

[project.scripts]
security-agent = "cli:main"

[tool.setuptools]
py-modules = ["scan", "cli"]

[tool.setuptools.packages.find]
include = ["core*", "agents*", "detectors*", "remediation*", "dashboard*", "verification*"]
